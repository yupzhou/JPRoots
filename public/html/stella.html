<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JPRoots STELLA 词族星系</title>
  <meta name="description" content="日琉语综合知识站：词族星系">
  <link rel="icon" type="image/x-icon" href="../images/logo.png">
  <script src="https://d3js.org/d3.v7.min.js"></script>

  </head>
  
  <style>
    :root {
      /* 背景色 */
      --bg-primary: #e8f4f8;
      --bg-secondary: rgba(15, 20, 40, 0.85);
      --bg-tertiary: rgba(10, 15, 30, 0.8);

      /* 词族球颜色 - 5档 */
      --node-size1: #74b9ff;
      --node-size2: #81ecec;
      --node-size3: #55efc4;
      --node-size4: #ffeaa7;
      --node-size5: #fab1a0;

      /* 单词球颜色 */
      --node-word: #3498db;

      /* 高亮颜色 */
      --highlight-root: #e17055;
      --highlight-word: #2d3436;

      /* 外发光颜色 */
      --glow-color: rgba(255, 255, 255, 0.6);
      --glow-top100: rgba(255, 255, 255, 0.9);
      --glow-highlight: rgba(255, 255, 255, 1);

      /* 文字颜色 */
      --text-primary: #2d3436;
      --text-secondary: #636e72;
      --text-light: #ffffff;
      --text-outline: rgba(255, 255, 255, 0.8);

      /* UI颜色 */
      --ui-border: rgba(255, 255, 255, 0.2);
      --ui-shadow: rgba(0, 0, 0, 0.6);
      --ui-accent: #4dabf7;
      --ui-accent-hover: #3b82f6;

      /* 悬停背景色 - 动态设置 */
      --ui-hover-bg: rgba(255, 255, 255, 0.2);
      /* 默认深色背景用 */

      /* 液态玻璃参数 */
      --glass-blur: 20px;
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-inner-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
      --glass-outer-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --glass-highlight: inset 0 0 20px rgba(255, 255, 255, 0.1);
      --glass-reflection: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
    }

    /* ================= 基础样式 ================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

/* ================= 视差微粒深空背景 ================= */
    #starfield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0; 
      pointer-events: none; /* 不拦截任何鼠标点击或拖拽事件 */
      transition: transform 5s linear; /* 视差移动过渡 */
    }

    /* 确保主容器和所有 UI 都在背景之上 */
    #main-container, #searchBox, #zoom-controls, #performance-panel, 
    #color-picker-panel, #minimap-wrapper, #queryTip, #loading-progress {
      position: relative;
      z-index: 1; 
    }

    body {
      background: var(--bg-primary);
      transition: background-color 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
      color: var(--text-primary);
      height: 100vh;
      width: 100vw;
      transition: background 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #main-container {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
      cursor: grab;
      display: block;
    }

    svg:active {
      cursor: grabbing;
    }

    /* ================= 球体液态玻璃效果 ================= */
    .node-root, .node-word {
      cursor: pointer;
      transition: r 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  stroke 0.3s ease, 
                  stroke-width 0.3s ease,
                  filter 0.3s ease;
      stroke: rgba(255, 255, 255, 0.3);
      stroke-width: 1.5px;
      paint-order: stroke fill;
    }

    /* 悬停时的引力光晕效果 */
    .node-root:hover, .node-word:hover {
      r: 34;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 3px;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)) url(#liquid-glass) !important;
    }
    
    .node-root {
      cursor: pointer;
      transition: r 0.3s ease-out;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5px;
      paint-order: stroke fill;
    }

    .node-root:hover { r: 30; }

    .node-root.size-1 { fill: var(--node-size1) !important; stroke: color-mix(in srgb, var(--node-size1) 70%, white) !important; }
    .node-root.size-2 { fill: var(--node-size2) !important; stroke: color-mix(in srgb, var(--node-size2) 70%, white) !important; }
    .node-root.size-3 { fill: var(--node-size3) !important; stroke: color-mix(in srgb, var(--node-size3) 70%, white) !important; }
    .node-root.size-4 { fill: var(--node-size4) !important; stroke: color-mix(in srgb, var(--node-size4) 70%, white) !important; }
    .node-root.size-5 { fill: var(--node-size5) !important; stroke: color-mix(in srgb, var(--node-size5) 70%, white) !important; }

    .node-root.top100 { stroke-width: 3px !important; }

    .node-word {
      fill: var(--node-word) !important;
      stroke: color-mix(in srgb, var(--node-word) 70%, white) !important;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.3s ease-out;
      paint-order: stroke fill;
    }

    .node-word:hover { r: 26; }

    .link {
      stroke: rgba(150, 200, 255, 0.4);
      stroke-opacity: 0.6;
      stroke-width: 1.5px;
      filter: drop-shadow(0 0 3px rgba(150, 200, 255, 0.5)); 
      transition: stroke-opacity 0.3s;
    }

    .label {
      fill: var(--text-light); font-weight: bold; text-anchor: middle; dominant-baseline: middle;
      pointer-events: none; transition: opacity 0.3s ease-out;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8); paint-order: stroke fill;
    }
    .label-root { font-size: 14px; }
    .label-word { font-size: 11px; }

        /* ================= 下位词族球样式 (视觉复用单词球) ================= */
    .node-subroot {
      fill: var(--node-word) !important;
      stroke: color-mix(in srgb, var(--node-word) 70%, white) !important;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: r 0.3s ease-out;
      paint-order: stroke fill;
    }
    .node-subroot:hover { r: 26; }

    .label-subroot { 
      font-size: 11px; 
      fill: var(--text-light); 
      font-weight: bold; 
      text-anchor: middle; 
      dominant-baseline: middle;
      pointer-events: none; 
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8); 
      paint-order: stroke fill;
    }

    /* 下位词族白色覆盖层（在球上、字下） */
    .subroot-overlay {
      fill: url(#subroot-frost); /* 径向渐变 */
      pointer-events: none;      /* 不拦截鼠标点击和悬停事件 */
      transition: r 0.3s ease-out;
    }

    .node.highlight {
      fill: var(--highlight-word) !important; stroke: var(--highlight-word) !important;
      stroke-width: 4px !important; animation: pulse 1.5s infinite alternate;
    }
    .node-root.highlight {
      fill: var(--highlight-root) !important; stroke: #ffd700 !important;
      stroke-width: 4px !important; animation: pulse-gold 1.5s infinite alternate;
    }

    /* 呼吸灯动画 */
    @keyframes pulse { 0% { stroke-width: 4px; } 100% { stroke-width: 7px; } }
    @keyframes pulse-gold { 0% { stroke-width: 4px; } 100% { stroke-width: 7px; } }

    /* ================= 液态玻璃UI组件 ================= */
    .liquid-glass {
      background: rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ================= 搜索框 ================= */
    #searchBox {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.17);
  backdrop-filter: blur(var(--glass-blur));
  -webkit-backdrop-filter: blur(var(--glass-blur));
  border-radius: 16px;
  padding: 12px 20px;
  border: 1px solid var(--glass-border);
  box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
  z-index: 1000;
  cursor: move;
  min-width: 320px;
  user-select: none;
  max-width: 500px;
  width: 60%;
}

@media (max-width: 768px) {
  #searchBox {
    min-width: unset;
    max-width: calc(100% - 40px);
    padding: 8px 12px;
    font-size: 12px;
    left: 33%;
  }
  #searchBox .search-row {
    gap: 6px;
  }
  #searchBox select,
  #searchBox input,
  #searchBox button {
    padding: 6px 10px;
    font-size: 12px;
  }
  #searchBox select {
    width: 70px;
  }
}

    .search-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--text-light);
      font-weight: 500;
    }

    .search-row {
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
    }

    select,
    input,
    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      color: var(--text-light);
      font-size: 14px;
      outline: none;
      box-shadow: var(--glass-inner-shadow), var(--glass-highlight);
      transition: all 0.3s ease;
    }

    select {
      width: 90px;
      cursor: pointer;
    }

    input {
      flex: 1;
      min-width: 50px;
    }

    input:focus {
      border-color: var(--ui-accent);
      box-shadow: 0 0 0 2px rgba(77, 171, 247, 0.2), var(--glass-inner-shadow);
    }

    button {
      background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-hover));
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      white-space: nowrap;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-inner-shadow), var(--glass-highlight);
    }

    button:hover {
      background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-hover));
      transform: translateY(-1px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), var(--glass-inner-shadow);
    }

    #searchResults {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 0 0 12px 12px;
      border: 1px solid var(--glass-border);
      border-top: none;
      max-height: 300px;
      overflow-y: auto;
      z-index: 1002;
      display: none;
      box-shadow: var(--glass-outer-shadow);
    }

    .search-result-item {
      padding: 12px 15px;
      cursor: pointer;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      transition: background 0.2s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .search-result-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .search-result-item.selected {
      background: rgba(59, 130, 246, 0.3);
    }

    .result-label {
      font-weight: bold;
      color: var(--text-light);
    }

    .result-type {
      font-size: 12px;
      color: #8bb9fe;
      background: rgba(139, 185, 254, 0.1);
      padding: 3px 10px;
      border-radius: 20px;
    }

    /* ================= 缩放控件 ================= */
    #zoom-controls {
      position: fixed;
      bottom: 20px;
      right: 10px;
      background: rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 50px;
      padding: 10px 15px;
      box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
      border: 1px solid var(--glass-border);
      z-index: 1000;
      display: flex;
      flex-direction: row;
      gap: 10px;
      align-items: center;
    }

@media (max-width: 768px) {
  #zoom-reset {
    display: none !important; /* 隐藏重置按钮 */
  }
  #zoom-controls {
    padding: 8px 12px;
    gap: 4px !important;
    bottom: 50px;
  }
  #zoom-controls button {
    width: 34px !important;
    height: 34px !important;
    font-size: 16px !important;
  }
}

    #zoom-controls button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-hover));
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      color: white;
      border: 1px solid var(--glass-border);
      cursor: pointer;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--glass-inner-shadow), var(--glass-highlight);
      transition: all 0.3s ease;
    }

    #zoom-controls button:hover {
      background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-hover));
      transform: scale(1.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), var(--glass-inner-shadow);
    }

    #zoom-level {
      color: var(--text-light);
      font-size: 13px;
      text-align: center;
      min-width: 45px;
      font-weight: bold;
    }

    /* ================= 小星图 ================= */
    #minimap-wrapper {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 999;
      pointer-events: none;
    }

    #minimap-container {
      position: relative;
      height: 40px;
      background: rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      pointer-events: auto;
    }

    #minimap-container.expanded {
      width: 200px;
      height: 240px;
    }

    #minimap-header {
      padding: 10px;
      font-size: 12px;
      color: var(--text-light);
      text-align: center;
      font-weight: 500;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #minimap-svg {
      width: 100%;
      height: calc(100% - 40px);
      display: none;
      background: rgba(10, 15, 30, 0.8);
      cursor: grab; /* 鼠标悬停时显示抓手 */
    }

    #minimap-svg:active {
      cursor: grabbing; /* 鼠标按下拖动时显示紧握抓手 */
    }

    #minimap-container.expanded #minimap-svg {
      display: block;
    }

    #minimap-viewport {
      position: absolute;
      border: 2px solid #00ffff;
      background: rgba(0, 255, 255, 0.1);
      pointer-events: none;
      box-sizing: border-box;
      transition: all 0.1s ease-out;
      display: none;
    }

    #minimap-container.expanded #minimap-viewport {
      display: block;
    }

    /* ================= 性能信息面板 ================= */
    #performance-panel {
  position: fixed;
  bottom: 10px;
  left: 10px;
  background: rgba(0, 0, 0, 0.6);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 10px;
  z-index: 1000;
  min-width: unset;
  border: 1px solid var(--ui-border);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}

.perf-row {
  display: flex;
  align-items: center;
  margin: 0;
  color: #8bb9fe;
}

.perf-row span:first-child {
  margin-right: 4px;
}

    .perf-value {
      color: var(--ui-accent);
      font-weight: bold;
    }

    /* ================= 配色选择器 ================= */
#color-picker-panel {
      position: fixed;
      bottom: 50px;
      left: 10px;
      z-index: 1000;
      min-width: 60px;
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: rgba(0, 0, 0, 0.17);
    }

    /* 收纳：只显示头部，高度自适应 */
    #color-picker-panel:not(.expanded) {
      height: 51px;
      padding: 0;
    }

    /* 展开 */
    #color-picker-panel.expanded {
      height: auto;
      padding: 0;
    }

    .color-picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-light);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 50px; /* 胶囊状 */
      border: 1px solid var(--glass-border);
      box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
      transition: all 0.3s ease;
      gap: 8px;
      margin: 8px;
    }

    .color-picker-header:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .color-picker-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 0 8px 8px 8px;
    }

    .color-picker-panel.expanded .color-picker-content {
      max-height: 127px;
      overflow-y: auto;
    }

    .color-picker-content::-webkit-scrollbar {
      width: 6px;
    }

    .color-picker-content::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .color-picker-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.4);
      border-radius: 10px;
    }

    .color-picker-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.6);
    }

    .color-scheme-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0;
    }

    .color-scheme-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      width: 100%;
    }

    .color-scheme-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .color-scheme-btn.active {
      border-color: var(--ui-accent);
      box-shadow: 0 0 15px rgba(77, 171, 247, 0.3);
    }

    .color-preview {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      box-shadow:
        inset 0 1px 2px rgba(255, 255, 255, 0.4),
        0 1px 4px rgba(0, 0, 0, 0.17);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      background: var(--preview-color);
    }

    .color-preview::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.4), transparent);
      border-radius: 50% 50% 40% 40%;
    }

    .color-name {
      font-size: 13px;
      color: var(--text-light);
      font-weight: 500;
    }

    /* ================= 加载进度条 ================= */
    #loading-progress {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.17);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0px 6px 11px rgba(0, 0, 0, 0.3), var(--glass-inner-shadow), var(--glass-highlight);
      border: 1px solid var(--glass-border);
      z-index: 2000;
      text-align: center;
      min-width: 300px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: rgba(100, 150, 255, 0.2);
      border-radius: 3px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--ui-accent), var(--ui-accent-hover));
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    #loading-text {
      color: var(--text-light);
      font-size: 14px;
      margin-top: 10px;
    }

    /* ================= 提示框 ================= */
    #queryTip {
      position: absolute;
      display: none;
      z-index: 1001;
      max-width: 220px;
      background: rgba(0, 0, 0, 0.17);

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;

      for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    function initColorPicker() {
        const grid = document.getElementById('colorSchemeGrid');
        const header = document.getElementById('colorPickerHeader');
        const content = document.getElementById('colorPickerContent');
        const toggle = document.getElementById('colorPickerToggle');
        const panel = document.getElementById('color-picker-panel');
        const randomColorBtn = document.getElementById('randomColorBtn'); 

        // 生成配色方案按钮
        Object.keys(COLOR_SCHEMES).forEach(schemeName => {
          const scheme = COLOR_SCHEMES[schemeName];

          // 检查是否是纯文本注释（以 _text_ 开头）
          if (schemeName.startsWith('_text_')) {
            // 创建纯文本元素
            const textElement = document.createElement('div');
            textElement.className = 'color-scheme-text';
            // 去掉 _text_ 前缀，显示剩余部分
            textElement.textContent = schemeName.replace('_text_', '');
            grid.appendChild(textElement);
            return; // 跳过后续按钮创建逻辑
          }

          // 正常创建配色方案按钮
          const btn = document.createElement('div');
          btn.className = 'color-scheme-btn';
          btn.dataset.scheme = schemeName;
          if (schemeName === currentColorScheme) btn.classList.add('active');

          btn.innerHTML = `
  <div class="color-preview" style="background: ${scheme.preview_color};"></div>
  <div class="color-name">${schemeName}</div>
`;

          btn.addEventListener('click', () => {
            applyColorScheme(schemeName);
            // 移除所有按钮的激活状态，包括随机按钮
            document.querySelectorAll('.color-scheme-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active'); // 激活当前按钮
          });

          grid.appendChild(btn);
        });

        // 随机配色按钮功能
      randomColorBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // 阻止事件冒泡

        // 获取所有有效的配色方案名称（排除纯文本注释）
        const validSchemes = Object.keys(COLOR_SCHEMES).filter(name => !name.startsWith('_text_'));

        // 随机选择一个配色方案
        const randomIndex = Math.floor(Math.random() * validSchemes.length);
        const randomScheme = validSchemes[randomIndex];

        // 应用随机配色
        applyColorScheme(randomScheme);

        // 更新按钮激活状态：移除所有按钮的激活状态，然后给随机按钮添加激活状态
        document.querySelectorAll('.color-scheme-btn').forEach(b => b.classList.remove('active'));
        randomColorBtn.classList.add('active'); // 添加激活状态

        // 添加点击动画效果
        randomColorBtn.style.transform = 'scale(0.95)';
        setTimeout(() => {
          randomColorBtn.style.transform = '';
        }, 150);
      });

        // 折叠/展开功能
        header.addEventListener('click', (e) => {
          e.stopPropagation(); // 阻止事件冒泡到画布
          panel.classList.toggle('expanded');

    function createCSVWorker() {
      const workerCode = `
  self.onmessage = function(e) {
    const csvText = e.data;
    const lines = csvText.split('\\n');
    const headers = parseCSVLine(lines[0]); // 解析表头
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      if (lines[i].trim()) {
        const values = parseCSVLine(lines[i]); // 处理引号
        const row = {};
        headers.forEach((header, index) => {
          row[header] = values[index] ? values[index].trim() : '';
        });
        data.push(row);
      }
    }
    postMessage(data);
  };

  // 注入parseCSVLine到Worker
  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  }
`;
      const blob = new Blob([workerCode], { type: 'application/javascript' });
      return new Worker(URL.createObjectURL(blob));
    }

    async function loadDataWithWorker() {
      try {
        updateLoadingProgress(10, "下载 CSV 文件...");
        const response = await fetch(CSV_FILE);
        const csvText = await response.text();
        updateLoadingProgress(30, "Web Worker 解析中...");
        const worker = createCSVWorker();
        worker.onmessage = function (e) {
          updateLoadingProgress(70, "处理词族数据...");
          processData(e.data);
          worker.terminate();
        };
        worker.postMessage(csvText);
      } catch (error) {
        console.error("Web Worker 解析失败，使用主线程解析：", error);
        updateLoadingProgress(30, "使用主线程解析...");
        loadDataTraditional();
      }
    }

    function loadDataTraditional() {
      fetch(CSV_FILE)
        .then(response => response.text())
        .then(csvText => {
          const lines = csvText.trim().split('\n');
          const headers = parseCSVLine(lines[0]);
          const data = lines.slice(1).map(line => {
            const values = parseCSVLine(line);
            const obj = {};
            headers.forEach((header, i) => {
              obj[header] = values[i] || '';
            });
            return obj;
          });
          updateLoadingProgress(70, "处理词族数据...");
          processData(data);
        })
        .catch(error => {
          console.error("加载 CSV 失败，使用模拟数据：", error);
          updateLoadingProgress(50, "使用模拟数据...");
          useMockData();
        });
    }

        // ================= 补全丢失的 processData 函数 =================
          function processData(data) {
            const firstRow = data[0];
            let rootCol = 'wd_f';
            let wordCol = 'word';

            if (!firstRow.hasOwnProperty('wd_f')) {
              const keys = Object.keys(firstRow);
              rootCol = keys.find(k => k.toLowerCase().includes('root')) || keys[0];
            }
            if (!firstRow.hasOwnProperty('word')) {
              const keys = Object.keys(firstRow);
              wordCol = keys.find(k => k.toLowerCase().includes('word')) || keys[1] || keys[0];
            }

            // 清空旧数据（防止重复加载）
            allRoots = []; rootToWords = {}; rootWordCount = {};
            rootToSubRoots = {}; subRootToWords = {}; wordToSubRoots = {};

            data.forEach(d => {
              const rootStr = d[rootCol]?.trim();
              const word = d[wordCol]?.trim();
              const subRootStr = d['wd_f_2']?.trim() || ''; // 读取下位词族

              if (!word) return;
              const roots = rootStr ? rootStr.split('|').map(r => r.trim()).filter(r => r !== '') : [];
              const subRoots = subRootStr ? subRootStr.split('|').map(r => r.trim()).filter(r => r !== '') : [];

              roots.forEach(root => {
                if (!rootToWords[root]) { rootToWords[root] = []; allRoots.push(root); rootWordCount[root] = 0; }
                if (!rootToWords[root].includes(word)) { rootToWords[root].push(word); rootWordCount[root]++; }

                subRoots.forEach(subRoot => {
                  if (!rootToSubRoots[root]) rootToSubRoots[root] = [];
                  if (!rootToSubRoots[root].includes(subRoot)) rootToSubRoots[root].push(subRoot);
                });
              });

              if (subRoots.length > 0) {
                if (!wordToSubRoots[word]) wordToSubRoots[word] = [];
                subRoots.forEach(subRoot => {
                  if (!wordToSubRoots[word].includes(subRoot)) wordToSubRoots[word].push(subRoot);
                  if (!subRootToWords[subRoot]) subRootToWords[subRoot] = [];
                  if (!subRootToWords[subRoot].includes(word)) subRootToWords[subRoot].push(word);
                });
              }
            });

            const sortedRoots = allRoots.sort((a, b) => rootWordCount[b] - rootWordCount[a]);
            top100Roots = new Set(sortedRoots.slice(0, 100));

            updateLoadingProgress(90, "初始化可视化...");
            setTimeout(() => {
              document.getElementById("loading-progress").style.display = "none";
              initGraph();
              initColorPicker();
              applyColorScheme("泡沫之夏");
            }, 300);
          }

        function toggleRoot(rootNode) {
            const root = rootNode.label;
            const rootId = rootNode.id;

            if (expandedRoots.has(root)) {
            // ================= 收起逻辑 (彻底修复版) =================

            // 1. 找出所有属于该 root 的 subroot 的 ID
            const relatedSubRootIds = (rootToSubRoots[root] || []).map(s => `subroot_${s}`);

            // 2. 删除所有相关连线：包括 root->subroot, root->word, 以及 subroot->word
            links = links.filter(l => {
              const sId = typeof l.source === 'object' ? l.source.id : l.source;
              const tId = typeof l.target === 'object' ? l.target.id : l.target;

              // 删除直接连接到当前 root 的连线
              if (sId === rootId || tId === rootId) return false;

              // 删除由属于该 root 的 subroot 发出的连线 (subroot -> word)
              if (relatedSubRootIds.includes(sId)) return false;

              return true;
            });

            // 3. 找出所有因为展开该 root 而存在的候选节点 (subroots 和 words)
            const candidateNodes = nodes.filter(n => {
              if (n.type === 'subroot') return rootToSubRoots[root]?.includes(n.label);
              if (n.type === 'word') return rootToWords[root]?.includes(n.label);
              return false;
            });

            // 4. 检查这些候选节点是否还连着其他已展开的 root
            const nodesToRemoveIds = new Set();
            candidateNodes.forEach(node => {
              const hasOtherExpandedRoot = links.some(l => {
                const sId = typeof l.source === 'object' ? l.source.id : l.source;
                const tId = typeof l.target === 'object' ? l.target.id : l.target;

                // 如果该节点连着某个 root，且那个 root 是已展开的（且不是当前 root）
                if (sId === node.id && tId.startsWith('root_') && expandedRoots.has(tId.substring(5))) return true;
                if (tId === node.id && sId.startsWith('root_') && expandedRoots.has(sId.substring(5))) return true;

                return false;
              });

              // 如果不连着其他已展开的 root，说明它彻底成了孤例，应该删除
              if (!hasOtherExpandedRoot) {
                nodesToRemoveIds.add(node.id);
              }
            });

            // 5. 缩小淡出动画
            const nodesToAnimate = mainG.selectAll(".node-word, .node-subroot").filter(d => nodesToRemoveIds.has(d.id));
            const labelsToAnimate = mainG.selectAll(".label-word, .label-subroot").filter(d => nodesToRemoveIds.has(d.id));
            const overlaysToAnimate = mainG.selectAll(".subroot-overlay").filter(d => nodesToRemoveIds.has(d.id));

            if (nodesToAnimate.size() > 0) {
              nodesToAnimate.transition().duration(300).ease(d3.easeCubicIn).attr("r", 0);
              overlaysToAnimate.transition().duration(300).ease(d3.easeCubicIn).attr("r", 0);
              labelsToAnimate.transition().duration(300).ease(d3.easeCubicIn).style("opacity", 0)
                .on("end", function (d, i) {
                  if (i === 0) {
                    nodes = nodes.filter(n => !nodesToRemoveIds.has(n.id));
                    expandedRoots.delete(root);
                    updateGraph();
                  }
                });
            } else {
              expandedRoots.delete(root);
              updateGraph();
            }

          } else {
              // ================= 展开逻辑 =================
              let hasNewNodes = false;

              // 1. 处理直接单词 (没有下位词族的单词，直接连到主词族)
              const directWords = (rootToWords[root] || []).filter(w => !wordToSubRoots[w] || wordToSubRoots[w].length === 0);
              directWords.forEach(word => {
                const wordId = `word_${word}`;
                if (!nodes.find(n => n.id === wordId)) {
                  const angle = Math.random() * 2 * Math.PI;
                  const distance = rootNode.radius + 5;
                  nodes.push({
                    id: wordId, label: word, type: "word", radius: 18,
                    x: rootNode.x + Math.cos(angle) * distance, y: rootNode.y + Math.sin(angle) * distance,
                    vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8, isNew: true
                  });
                  hasNewNodes = true;
                }
                if (!links.some(l => (l.source === rootId || l.source.id === rootId) && (l.target === wordId || l.target.id === wordId))) {
                  links.push({ source: rootId, target: wordId });
                }
              });

              // 2. 处理下位词族 (subroots) 及其包含的单词
              const subRoots = rootToSubRoots[root] || [];
              subRoots.forEach(subRoot => {
                const subRootId = `subroot_${subRoot}`;

                // 创建下位词族节点
                if (!nodes.find(n => n.id === subRootId)) {
                  const angle = Math.random() * 2 * Math.PI;
                  const distance = rootNode.radius + 5;
                  nodes.push({
                    id: subRootId, label: subRoot, type: "subroot", radius: 18,
                    x: rootNode.x + Math.cos(angle) * distance, y: rootNode.y + Math.sin(angle) * distance,
                    vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8, isNew: true
                  });
                  hasNewNodes = true;
                }
                // 连线: 主词族 -> 下位词族
                if (!links.some(l => (l.source === rootId || l.source.id === rootId) && (l.target === subRootId || l.target.id === subRootId))) {
                  links.push({ source: rootId, target: subRootId });
                }

                // 3. 处理该下位词族下的单词
                const wordsInSubRoot = subRootToWords[subRoot] || [];
                wordsInSubRoot.forEach(word => {
                  const wordId = `word_${word}`;
                  if (!nodes.find(n => n.id === wordId)) {
                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 18 + 5; // 从 subroot 节点向外扩散
                    // 获取 subroot 节点当前坐标作为中心
                    const subNode = nodes.find(n => n.id === subRootId);
                    const cx = subNode ? subNode.x : rootNode.x;
                    const cy = subNode ? subNode.y : rootNode.y;

                    nodes.push({
                      id: wordId, label: word, type: "word", radius: 18,
                      x: cx + Math.cos(angle) * distance, y: cy + Math.sin(angle) * distance,
                      vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8, isNew: true
                    });
                    hasNewNodes = true;
                  }
                  // 连线: 下位词族 -> 单词
                  if (!links.some(l => (l.source === subRootId || l.source.id === subRootId) && (l.target === wordId || l.target.id === wordId))) {
                    links.push({ source: subRootId, target: wordId });
                  }
                });
              });

              expandedRoots.add(root);
              updateGraph();

              // 放大淡入动画
              if (hasNewNodes) {
                const newNodes = mainG.selectAll(".node-word, .node-subroot").filter(d => d.isNew);
                const newLabels = mainG.selectAll(".label-word, .label-subroot").filter(d => d.isNew);
                // 获取新生成的覆盖层
                const newOverlays = mainG.selectAll(".subroot-overlay").filter(d => d.isNew);

                newNodes.attr("r", 0).transition().duration(300).ease(d3.easeBackOut).attr("r", 18);
                // 覆盖层同步从 0 弹性放大到目标半径
                newOverlays.attr("r", 0).transition().duration(300).ease(d3.easeBackOut).attr("r", d => d.radius * 0.85);
                newLabels.style("opacity", 0).transition().duration(300).ease(d3.easeCubicOut).style("opacity", 1);

                nodes.forEach(n => n.isNew = false);
              }
            }
          }

    function useMockData() {

      rootToWords = {};
      rootWordCount = {};

      for (let i = 1; i <= 200; i++) {
        const root = `词族${i}`;

        rootToWords[root] = [];
        const wordCount = Math.floor(Math.random() * 80) + 1;
        rootWordCount[root] = wordCount;
        for (let j = 1; j <= wordCount; j++) {
          rootToWords[root].push(`单词${j}`);
        }
      }

      const sortedRoots = allRoots.sort((a, b) => rootWordCount[b] - rootWordCount[a]);
      top100Roots = new Set(sortedRoots.slice(0, 100));

  // ================= 悬停引力波纹 =================
  function createRipple(event, d) {

    if (currentScale < 0.6) return;
    
      // 参数调节面板
      const LAYERS = 2;      // 1. 波纹圈数
      const DELAY = 100;     // 2. 发射延迟（毫秒）
      // =========================================================

      for (let i = 0; i < LAYERS; i++) {
        const ripple = mainG.insert("circle", ".node")
          .attr("cx", d.x)
          .attr("cy", d.y)
          .attr("r", d.radius + 1) // 比球大1px，确保在下层时边缘能透出来，不会完全被吃掉
          .attr("fill", "none")
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 3)
          .attr("pointer-events", "none")
          .attr("opacity", 0.8);

        // 扩散动画
        ripple.transition()
          .delay(i * DELAY)  // 错开发射
          .duration(800)
          .ease(d3.easeCubicOut)
          .attr("r", d.radius * 3)
          .attr("stroke-width", 0.1)
          .attr("opacity", 0)
          .remove();
      }
    }

    function initGraph() {
        mainSvg = d3.select("#graph-svg");

      const defs = mainSvg.append("defs");
      const filter = defs.append("filter")
        .attr("id", "liquid-glass")
        .attr("x", "-50%").attr("y", "-50%")
        .attr("width", "200%").attr("height", "200%");

      // 1. 外发光
      filter.append("feGaussianBlur").attr("in", "SourceAlpha").attr("stdDeviation", "5").attr("result", "blur");
      filter.append("feFlood").attr("flood-color", "#ffffff").attr("flood-opacity", "0.6").attr("result", "glowColor");
      filter.append("feComposite").attr("in", "glowColor").attr("in2", "blur").attr("operator", "in").attr("result", "glow");

      // 2. 顶部内高光
      filter.append("feOffset").attr("dx", "0").attr("dy", "3").attr("in", "SourceAlpha").attr("result", "offset");
      filter.append("feGaussianBlur").attr("stdDeviation", "2").attr("in", "offset").attr("result", "blur2");
      filter.append("feComposite").attr("operator", "out").attr("in", "SourceAlpha").attr("in2", "blur2").attr("result", "inverse");
      filter.append("feFlood").attr("flood-color", "#ffffff").attr("flood-opacity", "0.4").attr("result", "highlightColor");
      filter.append("feComposite").attr("in", "highlightColor").attr("in2", "inverse").attr("operator", "in").attr("result", "highlight");

      // 3. 合并图层
      const merge = filter.append("feMerge");
      merge.append("feMergeNode").attr("in", "glow");
      merge.append("feMergeNode").attr("in", "SourceGraphic");
      merge.append("feMergeNode").attr("in", "highlight");

        mainG = mainSvg.append("g");
        minimapContainer = document.getElementById("minimap-container");
        minimapSvg = d3.select("#minimap-svg");
        minimapG = minimapSvg.append("g");
        minimapViewport = d3.select("#minimap-viewport");
        performanceMode = allRoots.length > PERFORMANCE_THRESHOLD;
        updatePerformancePanel();
        initMinimap();
        initForceSimulation();
        updateGraph();
        initZoom();
        requestAnimationFrame(updatePerformance);

        // 立即居中
        immediateCenterView();

        // 性能模式下停止模拟
        if (performanceMode) {
          setTimeout(() => mainSimulation.stop(), 10000);
        }
      }

      // 立即居中
        function immediateCenterView() {
          const top100Nodes = nodes.filter(d => d.isTop100);
          if (top100Nodes.length === 0) return;

          let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
          top100Nodes.forEach(node => {
            if (node.x < minX) minX = node.x;
            if (node.x > maxX) maxX = node.x;
            if (node.y < minY) minY = node.y;
            if (node.y > maxY) maxY = node.y;
          });

          const padding = 100;
          minX -= padding; maxX += padding; minY -= padding; maxY += padding;
          const graphWidth = maxX - minX;
          const graphHeight = maxY - minY;
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const scale = Math.min(viewportWidth / graphWidth, viewportHeight / graphHeight, 1);
          const translateX = (viewportWidth - graphWidth * scale) / 2 - minX * scale;
          const translateY = (viewportHeight - graphHeight * scale) / 2 - minY * scale;

          mainSvg.call(zoomBehavior.transform, d3.zoomIdentity.translate(translateX, translateY).scale(scale));
        }

    function getSizeLevel(wordCount) {
      for (const level of SIZE_LEVELS) {
        if (wordCount >= level.min && wordCount < level.max) { return level; }
      }
      return SIZE_LEVELS[SIZE_LEVELS.length - 1];
    }

    function initForceSimulation() {
      const centerX = BASE_SIZE / 2;
      const centerY = BASE_SIZE / 2;
      const innerRadius = 400; //词族内圈
      const outerRadius = 800; //词族外圈

      nodes = allRoots.map((root, i) => {
        const wordCount = rootWordCount[root] || 0;
        const sizeLevel = getSizeLevel(wordCount);
        const isTop100 = top100Roots.has(root);
        let radius, x, y;

        if (isTop100) {
          radius = sizeLevel.radius;
          const angle = (i / 100) * 2 * Math.PI;
          const distance = Math.random() * innerRadius;
          x = centerX + Math.cos(angle) * distance;
          y = centerY + Math.sin(angle) * distance;
        } else {
          radius = sizeLevel.radius * 0.9;
          const angle = Math.random() * 2 * Math.PI;
          const distance = outerRadius + Math.random() * 300; //词族外圈范围
          x = centerX + Math.cos(angle) * distance;
          y = centerY + Math.sin(angle) * distance;
        }

        return {
          id: `root_${root}`,
          label: root,
          type: "root",
          radius: radius,
          isTop100: isTop100,
          wordCount: wordCount,
          sizeLevel: sizeLevel.size,
          brightness: sizeLevel.brightness,
          x: x,
          y: y
        };
      });

      // 斥力参数
      const chargeStrength = performanceMode ? -40 : -80;
      const alphaDecay = performanceMode ? 0.12 : 0.04;

      mainSimulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
          const r1 = d.source.radius || 30;
          const r2 = d.target.radius || 18;
          // 如果是 下位词族<->单词 的连线，基础间隙缩小为 15，让它们聚集成小星系
          const isSubWordLink = (d.source.type === 'subroot' && d.target.type === 'word') ||
            (d.target.type === 'subroot' && d.source.type === 'word');
          const baseGap = isSubWordLink ? 15 : 30;
          return r1 + r2 + baseGap;
        }).strength(0.6))
        .force("charge", d3.forceManyBody().strength(chargeStrength).distanceMin(40).distanceMax(400))
        .force("center", d3.forceCenter(centerX, centerY).strength(0.08))
        .force("collision", d3.forceCollide().radius(d => d.radius + 6))
        .alphaDecay(alphaDecay)
        .velocityDecay(0.5)
        .on("tick", updatePositions); // 【核心】绑定每帧更新函数
    }

    function updateGraph() {
        // ================= 1. 连线层 =================
        const link = mainG.selectAll(".link").data(links, d => `${d.source.id}-${d.target.id}`);
        link.exit().remove();
        link.enter().insert("line", ".node")
          .attr("class", "link")
          .attr("stroke-width", performanceMode ? 0.5 : 1.5)
          .merge(link);

        // ================= 2. 节点层 =================
        const node = mainG.selectAll(".node").data(nodes, d => d.id);
        node.exit().remove();

        const nodeEnter = node.enter().append("circle")
        .attr("class", d => {
          let cls = `node `;
          if (d.type === "root") {
            cls += "node-root";
            if (d.isTop100) cls += " top100";
            cls += ` size-${d.sizeLevel}`;
          } else if (d.type === "subroot") {
            cls += "node-subroot"; // 使用下位词族专属 class
          } else {
            cls += "node-word";
          }
          return cls;
        })
          .attr("r", d => d.radius)
          .attr("cx", d => d.x)
          .attr("cy", d => d.y)
          .attr("filter", "url(#liquid-glass)")
          .on("click", handleNodeClick)
          .on("mouseenter", function (event, d) {
            if (currentScale < 0.8) return; // LOD 拦截
            createRipple(event, d);
          })
          // 【新增】绑定拖拽事件
          .call(d3.drag()
            .on("start", function (event, d) {
              if (!event.active) mainSimulation.alphaTarget(0.3).restart();
              d.fx = d.x; d.fy = d.y;
            })
            .on("drag", function (event, d) {
              d.fx = event.x; d.fy = event.y;
            })
            .on("end", function (event, d) {
              if (!event.active) mainSimulation.alphaTarget(0);
              d.fx = null; d.fy = null; // 松开后交还给物理引擎
            }));;

        node.merge(nodeEnter);

      // ================= 2.5 下位词族白色覆盖层 =================
      const overlay = mainG.selectAll(".subroot-overlay").data(nodes.filter(d => d.type === 'subroot'), d => d.id);
      overlay.exit().remove();
      overlay.enter().append("circle")
        .attr("class", "subroot-overlay")
        .attr("r", d => d.radius)
        .merge(overlay);

        // ================= 3. 标签层 =================
        const label = mainG.selectAll(".label").data(nodes, d => d.id);
        label.exit().remove();
        label.enter().append("text")
        .attr("class", d => `label ${d.type === "root" ? "label-root" : (d.type === "subroot" ? "label-subroot" : "label-word")}`)
          .merge(label)
          .each(function (d) {
            const self = d3.select(this);
            self.selectAll("*").remove();
            const displayLabel = d.label;
            if (displayLabel.length > 4) {
              const firstLine = displayLabel.substring(0, 4);
              const secondLine = displayLabel.substring(4);
              const secondLineDisplay = secondLine.length > 4 ? secondLine.substring(0, 4) + "..." : secondLine;
              self.append("tspan").attr("x", 0).attr("dy", "-0.6em").text(firstLine);
              self.append("tspan").attr("x", 0).attr("dy", "1.2em").text(secondLineDisplay);
            } else { self.text(displayLabel); }
          });

        // 重启力导向模拟
        mainSimulation.nodes(nodes);
        mainSimulation.force("link").links(links);
        mainSimulation.alpha(0.3).restart();
      }

    function updatePositions() {
      mainG.selectAll(".link")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

      mainG.selectAll(".node")

        .attr("cy", d => d.y);

      mainG.selectAll(".label")
        .attr("transform", d => `translate(${d.x}, ${d.y})`);

      if (minimapContainer && minimapContainer.classList.contains("expanded")) {

        updateMinimapViewport();

    }

    function handleNodeClick(event, d) {

          showQueryTip(event, d);

    function initZoom() {
        // 初始化 lastTransform，防止首次加载时产生巨大的 dx/dy 跳变；这里假设初始 transform 是 (0,0)，通常 D3 初始就是 (0,0)
        lastTransformX = 0;
        lastTransformY = 0;

        zoomBehavior = d3.zoom()
          .scaleExtent([0.1, 5])
          .on("zoom", (event) => {
            currentScale = event.transform.k;
            mainG.attr("transform", event.transform);

            // 传入当前的绝对坐标，函数内部自动计算安全的增量 (dx, dy)
            applyParallaxOffset(event.transform.x, event.transform.y);

            document.getElementById("zoom-level").textContent = `${Math.round(currentScale * 100)}%`;

            // 原有 LOD 逻辑
            const isZoomedIn = currentScale >= 0.8;
            mainG.selectAll(".node").attr("filter", isZoomedIn ? "url(#liquid-glass)" : null);
            mainG.selectAll(".link").style("display", isZoomedIn ? "block" : "none");

            updateLabelsVisibility();
            if (minimapContainer && minimapContainer.classList.contains("expanded")) {
              updateMinimapViewport();
            }
          });
        mainSvg.call(zoomBehavior);
      }

    function updateLabelsVisibility() {
      const shouldShowLabels = currentScale >= LOD_THRESHOLD;
      if (shouldShowLabels !== labelsVisible) {
        labelsVisible = shouldShowLabels;
        mainG.selectAll(".label")
          .transition()
          .duration(200)
          .style("opacity", labelsVisible ? 1 : 0);
        document.getElementById("perf-labels").textContent = labelsVisible ? "开" : "关";
      }
    }

    function fitToTop100() {
        const top100Nodes = nodes.filter(d => d.isTop100);
        if (top100Nodes.length === 0) return;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        top100Nodes.forEach(node => {
          if (node.x < minX) minX = node.x;
          if (node.x > maxX) maxX = node.x;
          if (node.y < minY) minY = node.y;
          if (node.y > maxY) maxY = node.y;
        });
        const padding = 100;
        minX -= padding; maxX += padding; minY -= padding; maxY += padding;
        const graphWidth = maxX - minX;
        const graphHeight = maxY - minY;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const scale = Math.min(viewportWidth / graphWidth, viewportHeight / graphHeight, 1);
        const translateX = (viewportWidth - graphWidth * scale) / 2 - minX * scale;
        const translateY = (viewportHeight - graphHeight * scale) / 2 - minY * scale;
        mainSvg.transition().duration(1500).call(
          zoomBehavior.transform,
          d3.zoomIdentity.translate(translateX, translateY).scale(scale)
        );
      }

    function initMinimap() {
        minimapContainer = document.getElementById("minimap-container");
        const minimapHeader = document.getElementById("minimap-header");
        const minimapToggle = document.getElementById("minimapToggle");
        const minimapSvgEl = document.getElementById("minimap-svg");

        // 1. 展开/折叠逻辑
        minimapHeader.addEventListener("click", function (e) {
          e.stopPropagation();
          minimapContainer.classList.toggle("expanded");
          minimapToggle.textContent = minimapContainer.classList.contains("expanded") ? "▲" : "▼";
          if (minimapContainer.classList.contains("expanded")) {
            setTimeout(() => {
              updateMinimapNodes();
              updateMinimapViewport();
            }, 10);
          }
        });

        minimapToggle.addEventListener("click", function (e) {
          e.stopPropagation();
          minimapHeader.click();
        });

        // ================= 小星图拖动与点击逻辑 =================
        let isMinimapDragging = false;
        let minimapDragStartX = 0;
        let minimapDragStartY = 0;
        let hasDragged = false; // 用于区分 click 和 drag

        // 鼠标按下：准备拖动
        minimapSvgEl.addEventListener("mousedown", function (e) {
          if (!minimapContainer.classList.contains("expanded")) return;
          isMinimapDragging = true;
          hasDragged = false;
          minimapDragStartX = e.clientX;
          minimapDragStartY = e.clientY;
          e.preventDefault();
        });

        // 鼠标移动：执行画布平移
        document.addEventListener("mousemove", function (e) {
          if (!isMinimapDragging) return;

          const dx = e.clientX - minimapDragStartX;
          const dy = e.clientY - minimapDragStartY;

          // 如果移动超过 2px，标记为拖动状态（防止误触点击）
          if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
            hasDragged = true;
          }

          // 核心算法：小星图位移 -> 世界坐标位移 -> 屏幕像素位移
          // 视口框向右拖，相当于主画布内容向左移，取负号
          const screenDx = -(dx / MINIMAP_SCALE) * currentScale;
          const screenDy = -(dy / MINIMAP_SCALE) * currentScale;

          // 调用 D3 的平移方法
          mainSvg.call(zoomBehavior.translateBy, screenDx, screenDy);

          // 更新起点，实现丝滑连续拖动
          minimapDragStartX = e.clientX;
          minimapDragStartY = e.clientY;
        });

        // 鼠标松开：结束拖动 或 触发点击跳转
        document.addEventListener("mouseup", function (e) {
          if (!isMinimapDragging) return;
          isMinimapDragging = false;

          // 如果没有发生拖动，则视为点击，执行原有的跳转逻辑
          if (!hasDragged) {
            const rect = minimapSvgEl.getBoundingClientRect();
            const ratioX = (e.clientX - rect.left) / rect.width;
            const ratioY = (e.clientY - rect.top) / rect.height;
            const targetX = ratioX * BASE_SIZE;
            const targetY = ratioY * BASE_SIZE;
            const transform = d3.zoomTransform(mainSvg.node());
            const scale = transform.k;
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            mainSvg.transition()
              .duration(750)
              .call(zoomBehavior.transform,
                d3.zoomIdentity
                  .translate(viewportWidth / 2 - targetX * scale, viewportHeight / 2 - targetY * scale)
                  .scale(scale)
              );
          }
        });

        // ================= 小星图滚轮缩放逻辑 =================
        minimapContainer.addEventListener("wheel", function (e) {
          if (!minimapContainer.classList.contains("expanded")) return;
          e.preventDefault(); // 阻止页面默认滚动

          // 计算缩放因子 (向上滚放大，向下滚缩小)
          const delta = -e.deltaY;
          const scaleFactor = delta > 0 ? 1.1 : 0.9;

          const transform = d3.zoomTransform(mainSvg.node());
          // 以主屏幕正中心为锚点进行缩放，视觉最稳定
          const centerX = window.innerWidth / 2;
          const centerY = window.innerHeight / 2;

          // 计算新缩放比，并限制在 [0.1, 5] 范围内
          let newScale = transform.k * scaleFactor;
          newScale = Math.max(0.1, Math.min(5, newScale));

          // 计算保持屏幕中心点不变所需的 X/Y 平移量
          const worldX = (centerX - transform.x) / transform.k;
          const worldY = (centerY - transform.y) / transform.k;
          const newX = centerX - worldX * newScale;
          const newY = centerY - worldY * newScale;

          // 应用新的 Transform
          mainSvg.call(zoomBehavior.transform, d3.zoomIdentity.translate(newX, newY).scale(newScale));
        }, { passive: false });
      }

    function updateMinimapNodes() {
        if (!minimapG || !minimapContainer.classList.contains("expanded")) return;

        // 获取当前激活的配色方案
        const scheme = COLOR_SCHEMES[currentColorScheme];

        const miniNodes = minimapG.selectAll(".mini-node").data(nodes, d => d.id);
        miniNodes.exit().remove();

        miniNodes.enter().append("circle")
          .attr("class", "mini-node")
          .merge(miniNodes)
          .attr("cx", d => d.x * MINIMAP_SCALE)
          .attr("cy", d => d.y * MINIMAP_SCALE)
          .attr("r", d => {
            if (d.type === "root") { return d.isTop100 ? 6 : 3; }
            else { return 2; }
          })
          // 在生成/更新小星图节点时，直接赋予当前主题的颜色
          .attr("fill", d => {
            if (d.type === "root") {
              switch (d.sizeLevel) {
                case 1: return scheme.node_size1;
                case 2: return scheme.node_size2;
                case 3: return scheme.node_size3;
                case 4: return scheme.node_size4;
                case 5: return scheme.node_size5;
                default: return scheme.node_size1;
              }
            } else {
              return scheme.node_word;
            }
          });
      }

    function updateMinimapViewport() {
        if (!minimapViewport || !minimapContainer.classList.contains("expanded")) return;
        const transform = d3.zoomTransform(mainSvg.node());
        const scale = transform.k;
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        const viewX = -transform.x / scale;
        const viewY = -transform.y / scale;
        const viewW = viewportWidth / scale;
        const viewH = viewportHeight / scale;
        const miniX = viewX * MINIMAP_SCALE;
        const miniY = viewY * MINIMAP_SCALE;
        const miniW = viewW * MINIMAP_SCALE;
        const miniH = viewH * MINIMAP_SCALE;

        // 获取 SVG 画布相对于容器的顶部偏移量（即 header 的高度 40px）
        const svgOffsetTop = minimapSvg.node().offsetTop || 40;

        minimapViewport
          .style("left", miniX + "px")
          .style("top", (miniY + svgOffsetTop) + "px") // 加上偏移量
          .style("width", miniW + "px")
          .style("height", miniH + "px");
      }

    function updatePerformance() {
      frameCount++;
      const currentTime = performance.now();
      if (currentTime - lastTime >= 1000) {
        fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
        updatePerformancePanel();
        frameCount = 0;
        lastTime = currentTime;
      }
      requestAnimationFrame(updatePerformance);
    }

    function updatePerformancePanel() {
        document.getElementById("perf-nodes").textContent = nodes.length;
        document.getElementById("perf-fps").textContent = fps;
        document.getElementById("perf-mode").textContent = performanceMode ? "开" : "关"; 
        document.getElementById("perf-labels").textContent = labelsVisible ? "开" : "关"; 
      }

    function highlightNode(node) {
      mainG.selectAll(".node").classed("highlight", false);
      mainG.selectAll(".node")
        .filter(d => d.id === node.id)
        .classed("highlight", true);
    }

    function centerOnNode(node) {
      highlightNode(node);
      const transform = d3.zoomTransform(mainSvg.node());
      const screenX = transform.applyX(node.x);
      const screenY = transform.applyY(node.y);
      const containerWidth = window.innerWidth;
      const containerHeight = window.innerHeight;
      const dx = containerWidth / 2 - screenX;
      const dy = containerHeight / 2 - screenY;
      mainSvg.transition().duration(800).call(
        zoomBehavior.translateBy,
        dx / transform.k,
        dy / transform.k
      );
    }

    function showLabel(event, d) { }
    function hideLabel(event, d) { }

    function showQueryTip(event, d) {
      currentWord = d.label;
      const tip = document.getElementById("queryTip");
      document.getElementById("tipText").textContent = d.label;
      tip.style.left = (event.pageX + 15) + "px";
      tip.style.top = (event.pageY - 50) + "px";
      tip.style.display = "block";
      setTimeout(() => document.addEventListener("click", closeTipOnce), 10);
    }

    function closeTipOnce() {
      document.getElementById("queryTip").style.display = "none";
      document.removeEventListener("click", closeTipOnce);
    }

    function jumpToJLDB() {
      const win = window.open(JLDB_URL, "_blank");
      setTimeout(() => {
        if (win && win.document) {
          const searchInput = win.document.getElementById('searchInput');
          if (searchInput) {
            searchInput.value = currentWord;
            win.document.getElementById('searchBtn')?.click();
          }
        }
      }, 1000);
    }

    document.getElementById("searchBtn").addEventListener("click", performSearch);
    document.getElementById("searchInput").addEventListener("keypress", e => e.key === "Enter" && performSearch());
    document.addEventListener("click", e => !e.target.closest('#searchBox') && hideSearchResults());

    function performSearch() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const type = document.getElementById("searchType").value;
      if (!keyword) { hideSearchResults(); return; }
      let matches = [];
      if (type === "root" || type === "all") {
        allRoots.forEach(root => {
          if (root.toLowerCase().includes(keyword)) {
            const node = nodes.find(n => n.type === "root" && n.label === root);
            if (node) matches.push({ node: node, label: root, type: "词族" });
          }
        });
      }
      if (type === "word" || type === "all") {
        for (const [root, words] of Object.entries(rootToWords)) {
          words.forEach(word => {
            if (word.toLowerCase().includes(keyword)) {
              const existingNode = nodes.find(n => n.type === "word" && n.label === word);
              if (existingNode) {
                matches.push({ node: existingNode, label: word, type: "词汇", root: root });
              } else {
                matches.push({ node: { label: word, root: root }, label: word, type: "词汇", root: root });
              }
            }
          });
        }
      }
      const uniqueMatches = [];
      const seen = new Set();
      matches.forEach(match => {
        const key = match.node.id ? match.node.id : `${match.label}-${match.root}`;
        if (!seen.has(key)) { seen.add(key); uniqueMatches.push(match); }
      });
      if (uniqueMatches.length === 0) showNoResults();
      else if (uniqueMatches.length === 1) { selectAndCenter(uniqueMatches[0]); hideSearchResults(); }
      else showSearchResults(uniqueMatches);
    }

    function showSearchResults(matches) {
      const resultsContainer = document.getElementById("searchResults");
      resultsContainer.innerHTML = '';
      matches.forEach((match, index) => {
        const item = document.createElement('div');
        item.className = 'search-result-item';
        item.dataset.index = index;
        item.innerHTML = `<div><span class="result-label">${match.label}</span></div><span class="result-type">${match.type}</span>`;
        item.addEventListener('click', () => { selectAndCenter(match); hideSearchResults(); });
        item.addEventListener('mouseenter', () => {
          document.querySelectorAll('.search-result-item').forEach(el => el.classList.remove('selected'));
          item.classList.add('selected');
        });
        resultsContainer.appendChild(item);
      });
      resultsContainer.style.display = 'block';
      searchResultsVisible = true;
      if (resultsContainer.firstChild) resultsContainer.firstChild.classList.add('selected');
    }

    function showNoResults() {
      const resultsContainer = document.getElementById("searchResults");
      resultsContainer.innerHTML = '<div class="no-results">未找到匹配项</div>';
      resultsContainer.style.display = 'block';
      searchResultsVisible = true;
    }

    function hideSearchResults() {
      document.getElementById("searchResults").style.display = 'none';
      searchResultsVisible = false;
    }

    function selectAndCenter(match) {
      if (match.node.x !== undefined && match.node.y !== undefined) {
        centerOnNode(match.node);
      } else {
        const root = match.root;
        const rootNode = nodes.find(n => n.type === "root" && n.label === root);
        if (rootNode) {
          if (!expandedRoots.has(root)) {
            toggleRoot(rootNode);
            setTimeout(() => {
              const wordNode = nodes.find(n => n.type === "word" && n.label === match.label);
              if (wordNode) centerOnNode(wordNode);
            }, 100);
          } else {
            const wordNode = nodes.find(n => n.type === "word" && n.label === match.label);
            if (wordNode) centerOnNode(wordNode);
          }
        }
      }
    }

    const searchBox = document.getElementById("searchBox");
    searchBox.addEventListener("mousedown", startDrag);
    document.addEventListener("mousemove", drag);
    document.addEventListener("mouseup", endDrag);

    function startDrag(e) {
      if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT" || e.target.tagName === "BUTTON") return;
      isDragging = true;
      searchBox.classList.add("dragging");
      const rect = searchBox.getBoundingClientRect();
      dragOffset.x = e.clientX - rect.left;
      dragOffset.y = e.clientY - rect.top;
      e.preventDefault();
      searchBox.style.transform = 'none';
      searchBox.style.left = rect.left + 'px';
      searchBox.style.top = rect.top + 'px';
    }

    function drag(e) {
      if (!isDragging) return;
      let x = e.clientX - dragOffset.x;
      let y = e.clientY - dragOffset.y;
      const rect = searchBox.getBoundingClientRect();
      x = Math.max(0, Math.min(window.innerWidth - rect.width, x));
      y = Math.max(0, Math.min(window.innerHeight - rect.height, y));
      searchBox.style.left = x + "px";
      searchBox.style.top = y + "px";
    }

    function endDrag() { isDragging = false; searchBox.classList.remove("dragging"); }

    document.getElementById("searchInput").addEventListener("keydown", (e) => {
      if (!searchResultsVisible) return;
      const items = document.querySelectorAll('.search-result-item');
      if (items.length === 0) return;
      let selectedIndex = -1;
      items.forEach((item, index) => { if (item.classList.contains('selected')) selectedIndex = index; });
      if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
        updateSelection(items, selectedIndex);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
        updateSelection(items, selectedIndex);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (selectedIndex >= 0) items[selectedIndex].click();
      } else if (e.key === "Escape") hideSearchResults();
    });

    function updateSelection(items, index) {
      items.forEach(item => item.classList.remove('selected'));
      if (items[index]) { items[index].classList.add('selected'); items[index].scrollIntoView({ block: 'nearest' }); }
    }

    document.getElementById("zoom-in").addEventListener("click", () => {
      const transform = d3.zoomTransform(mainSvg.node());
      mainSvg.transition().duration(300).call(zoomBehavior.scaleTo, transform.k * 1.2);
    });

    document.getElementById("zoom-out").addEventListener("click", () => {
      const transform = d3.zoomTransform(mainSvg.node());
      mainSvg.transition().duration(300).call(zoomBehavior.scaleTo, transform.k * 0.8);
    });

    document.getElementById("zoom-reset").addEventListener("click", () => {
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;

        // 计算将画布中心(BASE_SIZE/2, BASE_SIZE/2)对齐到视口中心的平移量
        const translateX = viewportWidth / 2 - BASE_SIZE / 2;
        const translateY = viewportHeight / 2 - BASE_SIZE / 2;

        // 重置变换：缩放为1，平移到画布中心
        const resetTransform = d3.zoomIdentity
          .translate(translateX, translateY)
          .scale(1);

        mainSvg.transition().duration(300).call(zoomBehavior.transform, resetTransform);
      });

  // ================= 视差微粒深空背景 =================
  const starCanvas = document.getElementById('starfield');
    const ctx = starCanvas.getContext('2d');
    let stars = [];

    // 【参数调节面板】
    const STAR_COUNT = 150;          // 1. 粒子数量
    const PARALLAX_FACTOR = 0.08;    // 2. 视差系数 (0.08 表示主画布拖拽100px，背景反向移动8px)
    const MIN_OPACITY = 0.1;        // 3. 粒子最小透明度 (0.0 ~ 1.0)
    const MAX_OPACITY = 0.8;         // 4. 粒子最大透明度 (0.0 ~ 1.0)
    // =====================================================================

    // 记录上一次 D3 transform 的位置，用于计算增量
    let lastTransformX = 0;
    let lastTransformY = 0;

    function resizeStarCanvas() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', () => {
      resizeStarCanvas();
      initStarfield(); // 窗口大小改变时重新分布
    });
    resizeStarCanvas();

    class Star {
      constructor() {
        // 初始位置严格限制在屏幕范围内
        this.x = Math.random() * starCanvas.width;
        this.y = Math.random() * starCanvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * 0.05; // 自主漂浮
        this.speedY = (Math.random() - 0.5) * 0.05; // 自主漂浮
        this.opacity = Math.random() * (MAX_OPACITY - MIN_OPACITY) + MIN_OPACITY;
      }

      update() {
        // 1. 加上自主漂浮速度
        this.x += this.speedX;
        this.y += this.speedY;

        // 2. 实时边界取模循环 (贪吃蛇逻辑)，无论坐标如何变化，立刻将其拉回 [0, width] 和 [0, height] 范围内
        if (this.x < 0) this.x += starCanvas.width;
        if (this.x >= starCanvas.width) this.x -= starCanvas.width;
        if (this.y < 0) this.y += starCanvas.height;
        if (this.y >= starCanvas.height) this.y -= starCanvas.height;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.fill();
      }
    }

    function initStarfield() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(new Star());
      }
    }

    function animateStarfield() {
      ctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      stars.forEach(star => {
        star.update();
        star.draw();
      });
      requestAnimationFrame(animateStarfield);
    }

    // 启动背景系统
    initStarfield();
    animateStarfield();

    // 供 D3 Zoom 调用，施加增量视差
    function applyParallaxOffset(currentTransformX, currentTransformY) {
      // 计算本次事件的拖拽增量 (dx, dy)
      const dx = currentTransformX - lastTransformX;
      const dy = currentTransformY - lastTransformY;

      // 更新记录，供下一帧使用
      lastTransformX = currentTransformX;
      lastTransformY = currentTransformY;

      // 如果增量为0（例如仅仅是滚轮缩放，没有拖拽），则不处理
      if (dx === 0 && dy === 0) return;

      // 给所有粒子施加反向的视差偏移，并立即触发边界循环
      stars.forEach(star => {
        star.x -= dx * PARALLAX_FACTOR;
        star.y -= dy * PARALLAX_FACTOR;

        // 立即取模循环，确保坐标永不越界
        if (star.x < 0) star.x += starCanvas.width;
        if (star.x >= starCanvas.width) star.x -= starCanvas.width;
        if (star.y < 0) star.y += starCanvas.height;
        if (star.y >= starCanvas.height) star.y -= starCanvas.height;
      });
    }

    window.onload = loadDataWithWorker;
  </script>
