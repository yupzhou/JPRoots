  <script>
    // ================= 基础工具函数 =================
    function parseCSVLine(line) {
      const result = []; let current = ''; let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') { if (inQuotes && line[i + 1] === '"') { current += '"'; i++; } else { inQuotes = !inQuotes; } }
        else if (char === ',' && !inQuotes) { result.push(current); current = ''; }
        else { current += char; }
      }
      result.push(current); return result;
    }

    function stripParentheses(str) {
      let result = ''; let depth = 0;
      for (let i = 0; i < str.length; i++) {
        const char = str[i];
        if (char === '(' || char === '（') depth++;
        else if (char === ')' || char === '）') { if (depth > 0) depth--; }
        else { if (depth === 0) result += char; }
      }
      return result.replace(/\s+/g, ' ').trim();
    }

    function cleanDialectForm(formText) {
      if (!formText) return '';
      const pipeIndex = formText.indexOf('|');
      let text = pipeIndex !== -1 ? formText.substring(0, pipeIndex) : formText;
      if (text.indexOf('：') !== -1 || text.indexOf(':') !== -1) return '';
      const segments = text.split(/[,，;；]/);
      const cleanedSegments = [];
      for (let seg of segments) {
        let cleaned = seg.trim(); if (!cleaned) continue;
        const eqIndex = cleaned.indexOf('=');
        if (eqIndex !== -1) cleaned = cleaned.substring(0, eqIndex).trim();
        cleaned = stripParentheses(cleaned);
        cleaned = cleaned.replace(/^\d+\s+/, '').replace(/\s+[A-Za-z0-9\*\'\`\?]+$/, '');
        if (cleaned) cleanedSegments.push(cleaned);
      }
      return cleanedSegments.join(', ');
    }

    // ================= 1. 全局变量 =================
    let map, isoglossLayer, convexHullLayer, markerLayer, currentPoints = [];
    window.relationDict = {}; window.locationCoords = {};
    window.locationRegions = {}; window.dialectForms = {};
    window.wordData = []; window.fpjdData = []; window.deBoerData = [];

    // ================= 2. 地图初始化 =================
    function initMap() {
        map = L.map('map', {
          center: [36.2048, 138.2529],
          zoom: 5,
          zoomControl: false,
          attributionControl: true,
          preferCanvas: false
        });

        // 基础控件
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.control.scale({
        position: 'bottomright', 
        imperial: true,
        metric: true,
        maxWidth: 120
      }).addTo(map);

        // 鼠标经纬度实时显示
      L.control.mousePosition({
        position: 'bottomright', 
        prefix: '鼠标位置：',
        emptyString: '--, --',
        lngFormatter: function (lng) { return lng.toFixed(5) + '°E'; },
        latFormatter: function (lat) { return lat.toFixed(5) + '°N,'; },
        separator: '  '
      }).addTo(map);

        // 自定义 Pane
        map.createPane('maskPane');
        map.getPane('maskPane').style.zIndex = 250;
        map.getPane('maskPane').style.pointerEvents = 'none';

        map.createPane('polygonPane');
        map.getPane('polygonPane').style.zIndex = 350;
        map.getPane('polygonPane').style.pointerEvents = 'auto';

        // 海域遮罩
        L.polygon([[26, 123.3], [26, 124.7], [25.6, 124.7], [25.6, 123.3]], {
          pane: 'maskPane',
          color: '#dcf3fb',
          fillColor: '#dcf3fb',
          fillOpacity: 1,
          weight: 0,
          interactive: false
        }).addTo(map);

        // 主底图
        const mainLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: 'Tiles &copy; Esri &copy; OpenStreetMap contributors',
          maxZoom: 18
        }).addTo(map);

        // 小地图
        const miniMapLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
          attribution: ''
        });
        const miniMap = new L.Control.MiniMap(miniMapLayer, {
          position: 'topright',
          width: 120,
          height: 120,
          collapsedWidth: 35,
          collapsedHeight: 35,
          zoomLevelOffset: -5,
          zoomLevelFixed: 3,
          centerFixed: null,
          zoomAnimation: true,
          toggleDisplay: true,
          autoToggleDisplay: false,
          minimized: false,
          aimingRectOptions: { color: '#007bff', weight: 2, fillOpacity: 0.1 },
          shadowRectOptions: { color: '#808080', weight: 1, fillOpacity: 0 }
        }).addTo(map);

        // ================= 测量工具 =================
      let measurePoints = [];
      let measurePolyline = null;
      let measureMarkers = [];
      let isMeasuring = false;

      const measureBtn = L.control({ position: 'bottomright' });
      measureBtn.onAdd = function () {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
        div.innerHTML = '<a href="#" id="measure-toggle" class="measure-btn-icon" title="测量距离">📏</a>';

        L.DomEvent.disableClickPropagation(div);
        L.DomEvent.on(div, 'click', function (e) {
          e.preventDefault();
          const btn = div.querySelector('a');
          isMeasuring = !isMeasuring;

          if (isMeasuring) {
            map.getContainer().style.cursor = 'crosshair';
            map.on('click', addMeasurePoint);
            btn.style.background = '#007bff';
            btn.style.color = '#fff';
          } else {
            map.getContainer().style.cursor = '';
            map.off('click', addMeasurePoint);
            clearMeasure();
            btn.style.background = '';
            btn.style.color = '';
          }
        });
        return div;
      };
      measureBtn.addTo(map);

      function addMeasurePoint(e) {
        measurePoints.push(e.latlng);
        const marker = L.circleMarker(e.latlng, { radius: 4, color: '#007bff', fillColor: '#fff', fillOpacity: 1, weight: 2 }).addTo(map);
        measureMarkers.push(marker);

        if (measurePoints.length > 1) {
          if (measurePolyline) map.removeLayer(measurePolyline);
          measurePolyline = L.polyline(measurePoints, { color: '#007bff', weight: 2, dashArray: '5, 5' }).addTo(map);

          let totalDistance = 0;
          for (let i = 1; i < measurePoints.length; i++) {
            totalDistance += turf.distance(
              turf.point([measurePoints[i - 1].lng, measurePoints[i - 1].lat]),
              turf.point([measurePoints[i].lng, measurePoints[i].lat]),
              { units: 'kilometers' }
            );
          }

          // 显示距离标签
          const lastPoint = measurePoints[measurePoints.length - 1];
          const label = L.tooltip({ permanent: true, direction: 'center', className: 'custom-tooltip', offset: [0, -10] })
            .setLatLng(lastPoint)
            .setContent(totalDistance.toFixed(2) + ' km')
            .addTo(map);
          measureMarkers.push(label);
        }
      }

      function clearMeasure() {
        measurePoints = [];
        if (measurePolyline) { map.removeLayer(measurePolyline); measurePolyline = null; }
        measureMarkers.forEach(m => map.removeLayer(m));
        measureMarkers = [];
      }


        // 绘制工具
        const drawnItems = new L.FeatureGroup();
        map.addLayer(drawnItems);

        const drawControl = new L.Control.Draw({
          position: 'bottomright',
          edit: {
            featureGroup: drawnItems
          },
          draw: {
            polyline: {
              shapeOptions: { color: '#007bff', weight: 3 }
            },
            polygon: {
              shapeOptions: { color: '#007bff', fillOpacity: 0.2 }
            },
            circle: {
              shapeOptions: { color: '#007bff', fillOpacity: 0.2 }
            },
            rectangle: {
              shapeOptions: { color: '#007bff', fillOpacity: 0.2 }
            },
            marker: {
              icon: L.icon({
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                iconSize: [25, 41],
                iconAnchor: [12, 41]
              })
            },
            circlemarker: false
          }
        }).addTo(map);

        // 绘制事件监听
        map.on(L.Draw.Event.CREATED, function (e) {
          const layer = e.layer;
          drawnItems.addLayer(layer);
        });

        // 初始化图层组
        isoglossLayer = L.layerGroup();
        convexHullLayer = L.layerGroup();
        markerLayer = L.layerGroup().addTo(map);

        // 地图平移补偿与控件重组
      setTimeout(() => {
        map.panBy([-150, 0], { animate: false });

        // 将比例尺和缩放按钮包裹在一个 Flex 容器中，实现水平并排
        const zoomEl = document.querySelector('.leaflet-control-zoom');
        const scaleEl = document.querySelector('.leaflet-control-scale');
        if (zoomEl && scaleEl && zoomEl.parentNode === scaleEl.parentNode) {
          const wrapper = document.createElement('div');
          wrapper.className = 'leaflet-controls-row';
          zoomEl.parentNode.insertBefore(wrapper, zoomEl);
          wrapper.appendChild(scaleEl); // 比例尺在左
          wrapper.appendChild(zoomEl);  // 缩放按钮在右
        }
      }, 100);

      // ================= 左侧栏折叠 =================
      const collapseBtn = document.getElementById('collapseBtn');
      const leftPanel = document.getElementById('leftPanel');
      let isCollapsed = false;

      // 更新左侧控件位置的辅助函数
      function updateLayout(collapsed) {
        const panelWidth = collapsed ? 0 : 200;
        const leftOffset = panelWidth + 15;
        document.querySelector('.leaflet-left').style.left = leftOffset + 'px';
        setTimeout(() => { map.invalidateSize(); }, 300);
      }

      collapseBtn.addEventListener('click', function () {
        isCollapsed = !isCollapsed;
        if (isCollapsed) {
          leftPanel.classList.add('collapsed');
          collapseBtn.querySelector('i').className = 'fa fa-chevron-right'; // 向右箭头，表示可展开
          updateLayout(true);
        } else {
          leftPanel.classList.remove('collapsed');
          collapseBtn.querySelector('i').className = 'fa fa-chevron-left'; // 向左箭头，表示可折叠
          updateLayout(false);
        }
      });

      // 小屏环境下默认折叠
      if (window.innerWidth <= 431) {
        isCollapsed = true;
        leftPanel.classList.add('collapsed');
        collapseBtn.querySelector('i').className = 'fa fa-chevron-right';
        updateLayout(true);
      }
    }

    // ================= 3. 数据加载 =================
    async function loadJLDBData() {
        try {
          const [jldbText, relText, formText] = await Promise.all([
            fetch("JLDB.csv").then(res => res.text()),
            fetch("dialect_relation.csv").then(res => res.text()),
            fetch("dialect_form.csv").then(res => res.text())
          ]);

          // 地点清洗映射
          const locationCleanMap = {};

          const relLines = relText.trim().split(/\r?\n/); const relHeaders = parseCSVLine(relLines[0]);
          for (let i = 1; i < relLines.length; i++) {
            if (!relLines[i].trim()) continue;
            const values = parseCSVLine(relLines[i]); const row = {};
            relHeaders.forEach((h, idx) => row[h] = values[idx] || '');
            const rawLoc = row['地点']; if (!rawLoc) continue;
            const cleanLoc = (row['清洗'] && row['清洗'].trim() !== '') ? row['清洗'].trim() : rawLoc;

            // 记录原始地点到标准地点的映射关系
            locationCleanMap[rawLoc] = cleanLoc;

            if (!window.locationCoords[cleanLoc]) {
              window.locationRegions[cleanLoc] = row['方言大区'] || '其他';
              const lng = parseFloat(row['经度']), lat = parseFloat(row['纬度']);
              if (!isNaN(lng) && !isNaN(lat)) {
                window.locationCoords[cleanLoc] = { lng, lat };
                window.relationDict[cleanLoc] = { lng, lat, region: row['方言大区'] || '其他', order: parseInt(row['地点排序']) || 0 };
              }
            }
          }

          const formLines = formText.trim().split(/\r?\n/); const formHeaders = parseCSVLine(formLines[0]);
          for (let i = 1; i < formLines.length; i++) {
            if (!formLines[i].trim()) continue;
            const values = parseCSVLine(formLines[i]); const row = {};
            formHeaders.forEach((h, idx) => row[h] = values[idx] || '');

            // 在存入 dialectForms 前，将地点替换为标准地点名
            const rawLoc = row['地点'];
            if (rawLoc && locationCleanMap[rawLoc]) {
              row['地点'] = locationCleanMap[rawLoc];
            }

            const w = row['word'];
            if (w) { if (!window.dialectForms[w]) window.dialectForms[w] = []; window.dialectForms[w].push(row); }
          }

        const jldbLines = jldbText.trim().split(/\r?\n/); const headers = parseCSVLine(jldbLines[0]);
        window.wordData = jldbLines.slice(1).map(line => {
          if (!line.trim()) return null;
          const values = parseCSVLine(line); const obj = {};
          headers.forEach((header, idx) => obj[header] = values[idx] || ''); return obj;
        }).filter(item => item !== null);

        renderWordList('jldbWords', window.wordData.map(w => w.word));
      } catch (error) { console.error("JLDB 数据加载失败:", error); }
    }

    async function loadfpjdData() {
      try {
        // 读取新的 FPJD 文件
        const response = await fetch("FPJD_db_20251007_Simplified.csv");
        const text = await response.text();
        const lines = text.trim().split(/\r?\n/); const headers = parseCSVLine(lines[0]);
        window.fpjdData = lines.slice(1).map(line => {
          if (!line.trim()) return null;
          const values = parseCSVLine(line); const obj = {};
          headers.forEach((header, idx) => obj[header] = values[idx] || ''); return obj;
        }).filter(item => item !== null);

        // 注册坐标到全局字典
        window.fpjdData.forEach(item => {
          const loc = item['地点'];
          if (loc && !window.locationCoords[loc]) {
            const lat = parseFloat(item['纬度']), lng = parseFloat(item['经度']);
            if (!isNaN(lng) && !isNaN(lat)) {
              window.locationCoords[loc] = { lng, lat };
              window.relationDict[loc] = { lng, lat, region: 'FPJD调查', order: 9999 };
            }
          }
        });

        // 去重，防止出现大量重复项
        const uniqueProjects = [...new Set(window.fpjdData.map(p => p['项目']).filter(p => p))];
        renderWordList('fpjdWords', uniqueProjects);
      } catch (error) {
        document.getElementById('fpjdWords').innerHTML = '<li style="text-align:center; color:#2c2c2c; border:none;">暂无数据</li>';
      }
    }

  async function loadDeBoerData() {
    try {
      const response = await fetch("deBoer_2020_Modified.csv");
      const text = await response.text();
      const lines = text.trim().split(/\r?\n/); const headers = parseCSVLine(lines[0]);
      window.deBoerData = lines.slice(1).map(line => {
        if (!line.trim()) return null;
        const values = parseCSVLine(line); const obj = {};
        headers.forEach((header, idx) => obj[header] = values[idx] || ''); return obj;
      }).filter(item => item !== null);

      // 注册坐标到全局字典
      window.deBoerData.forEach(item => {
        const loc = item['地点'];
        if (loc && !window.locationCoords[loc]) {
          const lat = parseFloat(item['纬度']), lng = parseFloat(item['经度']);
          if (!isNaN(lng) && !isNaN(lat)) {
            window.locationCoords[loc] = { lng, lat };
            window.relationDict[loc] = { lng, lat, region: 'de Boer (2020)', order: 9998 };
          }
        }
      });

      // 去重
      const uniqueProjects = [...new Set(window.deBoerData.map(p => p['项目']).filter(p => p))];
      renderWordList('deBoer', uniqueProjects);
    } catch (error) {
      document.getElementById('deBoer').innerHTML = '<li style="text-align:center; color:#2c2c2c; border:none;">暂无数据</li>';
    }
  }

    // ================= 4. GIS 空间分析 =================
    function generateIsoglossAndHull(points) {
      if (points.length < 2 || typeof turf === 'undefined') return;
      const uniqueForms = [...new Set(points.map(p => p.form))];
      const colorPalette = ['#e6194b', '#3cb44b', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c'];
      const formColorMap = {};
      uniqueForms.forEach((form, index) => formColorMap[form] = colorPalette[index % colorPalette.length]);

      const formsGroup = {};
      points.forEach(p => { if (!formsGroup[p.form]) formsGroup[p.form] = []; formsGroup[p.form].push([p.lng, p.lat]); });
      for (const [form, coords] of Object.entries(formsGroup)) {
        const uniqueCoords = [...new Set(coords.map(c => c.join(',')))].map(s => s.split(',').map(Number));
        if (uniqueCoords.length >= 3) {
          const hull = turf.convex(turf.featureCollection(uniqueCoords.map(c => turf.point(c))));
          if (hull) L.geoJSON(hull, { pane: 'polygonPane', style: { color: formColorMap[form], weight: 2, opacity: 0.8, fillColor: formColorMap[form], fillOpacity: 0.15, dashArray: '5, 5' } }).addTo(convexHullLayer);
        } else if (uniqueCoords.length === 2) {
          L.polyline(uniqueCoords.map(c => [c[1], c[0]]), { pane: 'polygonPane', color: formColorMap[form], weight: 2, opacity: 0.8, dashArray: '5, 5' }).addTo(convexHullLayer);
        }
      }

      if (points.length >= 3) {
        const voronoiPoints = points.map(p => turf.point([p.lng, p.lat], { name: p.name, form: p.form }));
        const fc = turf.featureCollection(voronoiPoints);
        const bbox = turf.bbox(fc);
        const voronoiPolygons = turf.voronoi(fc, { bbox: [bbox[0] - 3, bbox[1] - 3, bbox[2] + 3, bbox[3] + 3] });
        if (voronoiPolygons) {
          const dissolvedFeatures = []; const voronoiFormsGroup = {};
          voronoiPolygons.features.forEach(feature => {
            let form = '';
            for (let pt of voronoiPoints) { if (turf.booleanPointInPolygon(pt, feature)) { form = pt.properties.form; break; } }
            feature.properties.form = form;
            if (!voronoiFormsGroup[form]) voronoiFormsGroup[form] = [];
            voronoiFormsGroup[form].push(feature);
          });
          for (const [form, features] of Object.entries(voronoiFormsGroup)) {
            if (features.length === 1) dissolvedFeatures.push(features[0]);
            else {
              try { let merged = features[0]; for (let i = 1; i < features.length; i++) merged = turf.union(merged, features[i]); merged.properties.form = form; dissolvedFeatures.push(merged); }
              catch (e) { features.forEach(f => dissolvedFeatures.push(f)); }
            }
          }
          L.geoJSON({ type: "FeatureCollection", features: dissolvedFeatures }, {
            pane: 'polygonPane',
            style: (feature) => ({ color: '#555', weight: 1.5, opacity: 0.6, fillColor: formColorMap[feature.properties.form] || '#ccc', fillOpacity: 0.2 }),
            onEachFeature: (feature, layer) => { if (feature.properties.form) layer.bindTooltip(`${feature.properties.form}`, { sticky: true, className: 'custom-tooltip' }); }
          }).addTo(isoglossLayer);
        }
      }

      if (document.getElementById('toggleIsogloss').checked) isoglossLayer.addTo(map);
      if (document.getElementById('toggleConvexHull').checked) convexHullLayer.addTo(map);
    }

    // ================= 5. 列表渲染与地图打点 =================
    function renderWordList(containerId, words) {
      const container = document.getElementById(containerId);
      container.innerHTML = words.map(w => `<li data-word="${w}">${w}</li>`).join('');
      container.querySelectorAll('li').forEach(item => {
        item.addEventListener('click', function () {
          const w = this.getAttribute('data-word');
          document.querySelectorAll('.word-list li').forEach(el => el.classList.remove('active'));
          this.classList.add('active');
          showWordOnMap(w);
        });
      });
    }

    function showWordOnMap(word) {
        // 清除所有旧图层
        if (isoglossLayer) map.removeLayer(isoglossLayer);
        if (convexHullLayer) map.removeLayer(convexHullLayer);
        if (markerLayer) map.removeLayer(markerLayer);

        // 重新初始化图层组
        isoglossLayer = L.layerGroup();
        convexHullLayer = L.layerGroup();
        markerLayer = L.layerGroup();
        currentPoints = [];

      // 查找 JLDB 数据
      if (window.dialectForms[word]) {
        window.dialectForms[word].forEach(form => {
          const loc = form['地点']; const formVal = cleanDialectForm(form['词形']);
          if (loc && formVal && window.locationCoords[loc]) {
            currentPoints.push({ name: loc, lng: window.locationCoords[loc].lng, lat: window.locationCoords[loc].lat, form: formVal });
          }
        });
      }

      // 查找 FPJD 数据
      const fpjdItems = window.fpjdData.filter(p => p['项目'] === word);
      fpjdItems.forEach(fpjdItem => {
        const loc = fpjdItem['地点'];
        const formVal = fpjdItem['形式'];
        if (loc && formVal && window.locationCoords[loc]) {
          currentPoints.push({ name: loc, lng: window.locationCoords[loc].lng, lat: window.locationCoords[loc].lat, form: formVal });
        }
      });

      // 查找 de Boer (2020) 数据
      const deBoerItems = window.deBoerData.filter(p => p['项目'] === word);
      deBoerItems.forEach(deBoerItem => {
        const loc = deBoerItem['地点']; const formVal = deBoerItem['形式'];
        if (loc && formVal && window.locationCoords[loc]) {
          currentPoints.push({ name: loc, lng: window.locationCoords[loc].lng, lat: window.locationCoords[loc].lat, form: formVal });
        }
      });

      if (currentPoints.length === 0) { alert(`词汇 "${word}" 暂无地理分布数据`); return; }

      generateIsoglossAndHull(currentPoints);

      const groupedPoints = {};
      currentPoints.forEach(p => {
        const key = `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
        if (!groupedPoints[key]) groupedPoints[key] = { lat: p.lat, lng: p.lng, locations: [] };
        groupedPoints[key].locations.push({ name: p.name, form: p.form });
      });

      Object.values(groupedPoints).forEach(group => {
        const isMultiple = group.locations.length > 1;
        const markerRadius = isMultiple ? 8 : 6;
        const markerColor = isMultiple ? '#ff9800' : '#007bff';

        const marker = L.circleMarker([group.lat, group.lng], {
          radius: markerRadius, fillColor: markerColor, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85,
          className: 'dialect-marker-anim'
        }).addTo(markerLayer); // 必须将 marker 加入到 markerLayer 中！

        let tooltipContent = '<div style="text-align:left; max-width: 260px;">';
        group.locations.forEach((loc, index) => {
          const marginTop = index > 0 ? 'margin-top: 8px; border-top: 1px dashed #ccc; padding-top: 8px;' : '';
          const tooltipForm = stripParentheses(loc.form);
          tooltipContent += `<div style="${marginTop}"><span style="color:${markerColor}; font-weight:bold;">${loc.name}</span><span style="color:#333; margin-left: 6px;"> ${tooltipForm}</span></div>`;
        });
        tooltipContent += '</div>';

        marker.bindTooltip(tooltipContent, { className: 'custom-tooltip', direction: 'right', offset: [10, 0] });
        marker.on('click', function () { this.openTooltip(); });
      });

      // 将新的打点图层组添加到地图
      markerLayer.addTo(map);

      if (currentPoints.length > 1) map.fitBounds(currentPoints.map(p => [p.lat, p.lng]), { padding: [50, 50] });
      else map.setView([currentPoints[0].lat, currentPoints[0].lng], 8);
    }

    // ================= 6. 搜索与防抖 =================
    let searchTimeout;
    document.getElementById('searchInput').addEventListener("input", () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const searchTerm = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!searchTerm) {
          renderWordList('jldbWords', window.wordData.map(w => w.word));
          const uniqueFpjd = [...new Set(window.fpjdData.map(p => p['项目']).filter(p => p))];
          renderWordList('fpjdWords', uniqueFpjd);
          const uniqueDeBoer = [...new Set(window.deBoerData.map(p => p['项目']).filter(p => p))];
          renderWordList('deBoer', uniqueDeBoer);
          return;
        }
        const jldbMatches = window.wordData.filter(w => w.word.toLowerCase().includes(searchTerm)).map(w => w.word);

        // 搜索结果同样需要去重
        const fpjdMatches = [...new Set(window.fpjdData.filter(p => p['项目'] && p['项目'].toLowerCase().includes(searchTerm)).map(p => p['项目']))];
        const deBoerMatches = [...new Set(window.deBoerData.filter(p => p['项目'] && p['项目'].toLowerCase().includes(searchTerm)).map(p => p['项目']))];

        if (jldbMatches.length > 0) renderWordList('jldbWords', jldbMatches);
        else document.getElementById('jldbWords').innerHTML = '<li style="text-align:center; color:#2c2c2c; border:none;">无匹配结果</li>';

        if (fpjdMatches.length > 0) renderWordList('fpjdWords', fpjdMatches);
        else document.getElementById('fpjdWords').innerHTML = '<li style="text-align:center; color:#2c2c2c; border:none;">无匹配结果</li>';

        if (deBoerMatches.length > 0) renderWordList('deBoer', deBoerMatches);
        else document.getElementById('deBoer').innerHTML = '<li style="text-align:center; color:#2c2c2c; border:none;">无匹配结果</li>';
      }, 300);
    });

    document.getElementById('searchBtn').addEventListener('click', function () {
      document.getElementById('searchInput').dispatchEvent(new Event('input'));
    });

    document.getElementById('toggleIsogloss').addEventListener('change', function () {
      if (this.checked && isoglossLayer) isoglossLayer.addTo(map); else if (isoglossLayer) map.removeLayer(isoglossLayer);
    });
    document.getElementById('toggleConvexHull').addEventListener('change', function () {
      if (this.checked && convexHullLayer) convexHullLayer.addTo(map); else if (convexHullLayer) map.removeLayer(convexHullLayer);
    });

    // ================= 7. 页面初始化与 URL 传参 =================
    window.addEventListener('load', async function () {
      initMap();
      await loadJLDBData();
      await loadfpjdData();
      await loadDeBoerData(); 
      document.getElementById('loading').style.display = 'none';

      const urlParams = new URLSearchParams(window.location.search);
      const targetWord = urlParams.get('word');
      if (targetWord) {
        document.getElementById('searchInput').value = targetWord;
        const jldbExact = window.wordData.find(w => w.word === targetWord);
        if (jldbExact) { renderWordList('jldbWords', [targetWord]); showWordOnMap(targetWord); return; }
        const fpjdExact = window.fpjdData.find(p => p['项目'] === targetWord);
        if (fpjdExact) {
          const uniqueProjects = [...new Set(window.fpjdData.map(p => p['项目']).filter(p => p))];
          renderWordList('fpjdWords', uniqueProjects);
          showWordOnMap(targetWord);
          return;
        }
        // de Boer 精确匹配
        const deBoerExact = window.deBoerData.find(p => p['项目'] === targetWord);
        if (deBoerExact) {
          const uniqueProjects = [...new Set(window.deBoerData.map(p => p['项目']).filter(p => p))];
          renderWordList('deBoer', uniqueProjects);
          showWordOnMap(targetWord);
          return;
        }
        document.getElementById('searchInput').dispatchEvent(new Event('input'));
      }
    });
  </script>
